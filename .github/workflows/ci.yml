---
# -- CI checks generated wire contracts, supported OMP extension loading, types and behavior on both Unix platforms.
# -- The real-binary smoke (official `omp` + scripted model endpoint) is not run here; see README "Verification".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # -- Unix-only: the bridge listens on a Unix domain socket (README "Known boundaries").
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # -- Actions pinned to commit SHAs; the trailing comment is the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # -- Native image validation requires Bun.Image; package.json requires >= 1.4.2.
          bun-version: 1.4.2

      # -- --frozen-lockfile: fail instead of silently drifting from bun.lock.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run schema:check

      - run: bun run extension:check

      - run: bun test
